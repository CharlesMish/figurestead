name: Publish accepted Figurestead browser artifact

run-name: >-
  @figurestead/web ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact accepted npm version, without a leading v
        required: true
        type: string
      dist_tag:
        description: Explicit npm dist-tag for the accepted version
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - next
          - latest
      expected_commit:
        description: Exact 40-character protected-main commit selected for dispatch
        required: true
        type: string
      expected_sha256:
        description: Approved SHA-256 of the exact expected retained tarball
        required: true
        type: string
      confirmation:
        description: Type the exact phrase documented in release/npm/README.md
        required: true
        type: string

permissions: {}

concurrency:
  group: figurestead-npm-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    name: Preflight exact retained candidate without publication authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up the accepted Node/npm runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.17.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Authenticate repository, exact candidate, and registry absence
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = "CharlesMish/figurestead"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REF_PROTECTED" = "true"
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$CONFIRMATION" = "publish @figurestead/web $VERSION with tag $DIST_TAG from accepted tarball"
          case "$DIST_TAG" in alpha|next|latest) ;; *) exit 64 ;; esac
          test "$(node --version)" = "v24.17.0"
          test "$(npm --version)" = "11.13.0"
          test "$(node -p 'require("./web/package.json").version')" = "$VERSION"

          node release/npm/verify-candidate.mjs \
            --version "$VERSION" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --release-root release/npm

          VERSION="$VERSION" node --input-type=module <<'NODE'
          const url = "https://registry.npmjs.org/" + encodeURIComponent("@figurestead/web") + "/" + encodeURIComponent(process.env.VERSION);
          const response = await fetch(url, { headers: { accept: "application/json" } });
          if (response.status === 200) throw new Error("version already exists");
          if (response.status !== 404) throw new Error(`registry preflight returned ${response.status}`);
          NODE

  publish:
    name: Reverify and publish exact retained tarball
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@figurestead/web/v/${{ inputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the same protected-main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up the accepted Node/npm runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.17.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Reverify exact bytes before trusted publication
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "CharlesMish/figurestead"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REF_PROTECTED" = "true"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$(node --version)" = "v24.17.0"
          test "$(npm --version)" = "11.13.0"
          test "$(node -p 'require("./web/package.json").version')" = "$VERSION"
          node release/npm/verify-candidate.mjs \
            --version "$VERSION" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --release-root release/npm

      - name: Publish with npm Trusted Publishing
        id: npm-publish
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: >-
          npm publish
          "release/npm/$VERSION/dist/figurestead-web-$VERSION.tgz"
          --access public
          --tag "$DIST_TAG"
          --registry=https://registry.npmjs.org/

      - name: Classify publication-command failure
        if: failure() && steps.npm-publish.outcome == 'failure'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### npm publication command failed

          npm did not report successful publication. The post-publish registry readback did not run.
          SUMMARY

  verify-public:
    name: Confirm exact public bytes after bounded registry propagation
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the same verification authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.17.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Bounded propagation-aware registry readback
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          node release/npm/verify-public-registry.mjs \
            --package @figurestead/web \
            --version "$VERSION" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --dist-tag "$DIST_TAG" \
            --registry https://registry.npmjs.org/

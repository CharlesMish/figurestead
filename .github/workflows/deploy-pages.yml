name: Deploy accepted Figurestead static site

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: figurestead-pages
  cancel-in-progress: false

jobs:
  build:
    name: Authenticate and package accepted static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out protected main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate accepted site tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "CharlesMish/figurestead"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse 'refs/tags/v0.9.0-alpha.1^{commit}')" = "f3cc4a4dbf40b60635707c5ad6e21856bac57057"
          python3 audit/public-site/validate-assets.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload exact site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1

  deploy:
    name: Deploy accepted site artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

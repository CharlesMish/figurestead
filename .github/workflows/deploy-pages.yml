name: Deploy accepted Figurestead static site

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: figurestead-pages
  cancel-in-progress: false

jobs:
  build:
    name: Authenticate and package accepted static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out protected main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate accepted site tree
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = "CharlesMish/figurestead"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse 'refs/tags/v0.9.0-alpha.1^{commit}')" = "f3cc4a4dbf40b60635707c5ad6e21856bac57057"
          changed_site_files="$(git diff --name-only f3cc4a4dbf40b60635707c5ad6e21856bac57057 -- site | LC_ALL=C sort)"
          test "$changed_site_files" = $'site/evidence/index.html\nsite/index.html\nsite/styles.css'
          test -f site/index.html
          test -f site/evidence/index.html
          test -f site/ASSET_MANIFEST.json
          test -z "$(find site -type l -print -quit)"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("site")
          accepted_pages = {
              "index.html": "af0d82e4cdb8a1a33841459359b3d1d97b415d7a054b311476051b76926bfa77",
              "evidence/index.html": "4a9a8dc174299a14ed63719942ff17b59a5cc57a353b10bddf986bcf15907b9e",
              "styles.css": "761d00c69424db87fa0430f639ba6ff2bea1d94cbcb4501f7744ceabdda93d28",
          }
          for relative, expected in accepted_pages.items():
              assert hashlib.sha256((root / relative).read_bytes()).hexdigest() == expected

          manifest = json.loads((root / "ASSET_MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["schemaVersion"] == "figurestead.public-alpha-assets/1"
          assert manifest["synthetic"] is True
          assert len(manifest["assets"]) == 17
          for entry in manifest["assets"]:
              path = root / entry["path"]
              assert path.is_file()
              payload = path.read_bytes()
              assert len(payload) == entry["bytes"]
              assert hashlib.sha256(payload).hexdigest() == entry["sha256"]
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload exact site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1

  deploy:
    name: Deploy accepted site artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
